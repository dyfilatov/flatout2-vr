; FO2Lyrics (standalone ASI mode, compatible with flat-screen FlatOut 2 and with FO2VR.asi).
; Log: FO2Lyrics.log next to this file. Lyrics folder: lyrics\*.lrc next to this file.

[Lyrics]
; No lyrics are shipped with the mod; run fetch_lyrics.cmd / fetch_lyrics.ps1 in scripts\ (or place
; your own .lrc files in scripts\lyrics\, matched by [file:], by [ti:] and [ar:], or by file name).
Lyrics=1            ; 1 = show the lyrics of the songs the game plays (0 = off; F10 toggles it)
Lines=3             ; how many lines show at once, the newest at the bottom (1..6)
Scale=1.0           ; the text's size, this many times as tall (0.5..3)
Y=0.82              ; in-race vertical position on UI (0.0 = top, 1.0 = bottom; 0.82 = between character & speedometer)
Colour=2828FF       ; the words not yet sung, 0xBBGGRR hex (FlatOut 2 game red)
SungColour=00D7FF   ; the words already sung / when to sing, 0xBBGGRR hex (FlatOut 2 yellow)

[Keys]
; Windows virtual key codes: 121 = F10
Lyrics=121          ; toggle karaoke lyrics on / off ([Lyrics] Lyrics 1 / 0)
